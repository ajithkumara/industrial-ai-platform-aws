name: Terraform CI

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    paths: ['terraform/**']

# AWS OIDC: short-lived credentials via role assumption. No static AWS keys.
permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: terraform/environments/dev

jobs:
  validate:
    name: Validate + Scan + Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init (no backend) + Validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: IaC security scan (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true   # findings reported; accepted set documented in docs/evidence

      - name: Terraform Plan (PR only)
        if: github.event_name == 'pull_request'
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -no-color -out=tfplan | tee /tmp/plan.txt
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '(no plan output)';
            try { plan = fs.readFileSync('/tmp/plan.txt', 'utf8').slice(0, 60000); } catch (e) {}
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: '#### Terraform Plan\n<details><summary>show</summary>\n\n```\n' + plan + '\n```\n</details>'
            });

  apply:
    name: Apply (main only)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev   # deploy gate: requires environment approval
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false
      - name: Terraform Apply
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}
